name: Build Onprem Release

on:
  push:
    tags:
      - "v*-onprem"
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream 版本号 (例如 1.18.5)"
        required: true
        type: string

# ── vars: 解析版本号（不 checkout，纯字符串操作）────────────
jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      upstream_ver: ${{ steps.parse.outputs.upstream_ver }}
      tag_name: ${{ steps.parse.outputs.tag_name }}
    steps:
      - name: Parse version
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPSTREAM_VER="${{ github.event.inputs.upstream_version }}"
            TAG_NAME="v${UPSTREAM_VER}-onprem"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            UPSTREAM_VER="${TAG_NAME#v}"
            UPSTREAM_VER="${UPSTREAM_VER%-onprem}"
          fi
          echo "upstream_ver=$UPSTREAM_VER" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "→ upstream=$UPSTREAM_VER  tag=$TAG_NAME"

  # ── build: matrix 构建 ─────────────────────────────────
  build:
    needs: vars
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_ext: tar.zst
          - os: windows-latest
            platform: win32
            artifact_ext: 7z
      # 单个平台失败不取消其余
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync manifest version
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('./manifest.json', 'utf-8'));
            m.version = '${{ needs.vars.outputs.upstream_ver }}';
            fs.writeFileSync('./manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "  ✓ manifest.json → v$(node -p "require('./manifest.json').version")"

      - name: Normalize patch line endings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sed -i 's/\r$//' patches/*.patch
          echo "  ✓ patches normalized to LF"

      - name: Download upstream v${{ needs.vars.outputs.upstream_ver }}
        shell: bash
        run: |
          UPSTREAM_VER="${{ needs.vars.outputs.upstream_ver }}"
          mkdir -p upstream
          curl -fsSL "https://github.com/anomalyco/opencode/archive/refs/tags/v${UPSTREAM_VER}.tar.gz" \
            | tar -xz -C upstream --strip-components=1
          echo "  ✓ upstream v${UPSTREAM_VER}"

      - name: Apply onprem patches
        shell: bash
        working-directory: upstream
        run: |
          git init
          git config core.autocrlf false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: init upstream v${{ needs.vars.outputs.upstream_ver }}"

          shopt -s nullglob
          for patch in ../patches/*.patch; do
            echo "  → $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
          done
          echo "  ✓ all patches applied"

          grep -q "const ONPREM =" packages/tui/src/parsers-config.ts && echo "  ✓ 001 verified" || exit 1
          grep -q "findPackageDir" packages/core/src/npm.ts && echo "  ✓ 002 verified" || exit 1

      - name: Copy build scripts
        shell: bash
        run: |
          DST="upstream/scripts/onprem"
          mkdir -p "$DST"
          cp scripts/download.ts "$DST/"
          cp scripts/pack.ts    "$DST/"
          cp scripts/env.sh     "$DST/"
          cp scripts/env.bat    "$DST/"
          cp scripts/env.ps1    "$DST/"
          cp manifest.json      "$DST/"
          cp plugins.json       "$DST/"
          echo "  ✓ copied to $DST/"
          ls "$DST" | sed 's/^/    /'

      - name: Install system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 zstd
          echo "  ✓ apt packages installed"

      - name: Install system deps
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install 7zip.install -y --no-progress
          echo "  ✓ 7zip installed"

      - name: Install dependencies
        shell: bash
        working-directory: upstream
        run: bun install

      - name: Build ${{ matrix.platform }} bundle
        shell: bash
        working-directory: upstream
        env:
          OPENCODE_CHANNEL: prod
        run: bun run scripts/onprem/pack.ts --platform ${{ matrix.platform }} --arch x64

      - name: Collect ${{ matrix.artifact_ext }} artifact
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p dist
          for f in upstream/dist/*.tar.zst upstream/dist/*.7z; do
            echo "  → $(basename "$f")"
            cp "$f" dist/
          done
          ls -lh dist/ | sed 's/^/  /'

      - name: Upload ${{ matrix.platform }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}-x64
          path: dist/

  # ── release: 汇总发布 ──────────────────────────────────
  release:
    needs: [vars, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: |
          echo "--- release artifacts ---"
          ls -lh dist/

      - name: Generate release notes
        run: |
          cat <<EOF > release_body.md
          ## opencode onprem v${{ needs.vars.outputs.upstream_ver }}

          同步更新到 v${{ needs.vars.outputs.upstream_ver }} 版本。

          详细更新参阅 [OpenCode v${{ needs.vars.outputs.upstream_ver }} Release](https://github.com/anomalyco/opencode/releases/tag/v${{ needs.vars.outputs.upstream_ver }})。

          | 平台 | 文件 |
          |---|---|
          | Linux x64 | opencode-onprem-v${{ needs.vars.outputs.upstream_ver }}-linux-x64.tar.zst |
          | Windows x64 | opencode-onprem-v${{ needs.vars.outputs.upstream_ver }}-win32-x64.7z |

          ---

          Synchronized update to version v${{ needs.vars.outputs.upstream_ver }}.
          See [OpenCode v${{ needs.vars.outputs.upstream_ver }} Release](https://github.com/anomalyco/opencode/releases/tag/v${{ needs.vars.outputs.upstream_ver }}) for detailed updates.
          EOF

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenCode Onprem ${{ needs.vars.outputs.tag_name }}"
          tag_name: ${{ needs.vars.outputs.tag_name }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.zst
            dist/*.7z
