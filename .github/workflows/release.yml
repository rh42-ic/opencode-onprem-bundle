name: Build Onprem Release

on:
  push:
    tags:
      - "v*-onprem"
  workflow_dispatch:
    inputs:
      upstream_version:
        description: "Upstream 版本号 (例如 1.18.5)"
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Parse version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            UPSTREAM_VER="${{ github.event.inputs.upstream_version }}"
            TAG_NAME="v${UPSTREAM_VER}-onprem"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
            UPSTREAM_VER="${TAG_NAME#v}"
            UPSTREAM_VER="${UPSTREAM_VER%-onprem}"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "UPSTREAM_VER=$UPSTREAM_VER" >> $GITHUB_ENV

      - name: Sync manifest version
        run: |
          node -e "
            const m = require('./manifest.json');
            m.version = '${{ env.UPSTREAM_VER }}';
            require('fs').writeFileSync('./manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "manifest.json: $(node -e "console.log(require('./manifest.json').version)")"

      - name: Download upstream
        run: |
          UPSTREAM_VER="${{ env.UPSTREAM_VER }}"
          mkdir -p upstream
          curl -fsSL "https://github.com/anomalyco/opencode/archive/refs/tags/v${UPSTREAM_VER}.tar.gz" \
            | tar -xz -C upstream --strip-components=1
          echo "UPSTREAM_DIR=$PWD/upstream" >> $GITHUB_ENV

      - name: Init git & apply patches
        working-directory: upstream
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: init upstream v${{ env.UPSTREAM_VER }}"

          for patch in ../patches/*.patch; do
            echo "→ $(basename "$patch")"
            git apply --check "$patch"
            git apply "$patch"
          done
          echo "✓ patches applied"

          grep -q "const ONPREM =" packages/tui/src/parsers-config.ts && echo "✓ 001 verified" || exit 1
          grep -q "findPackageDir" packages/core/src/npm.ts && echo "✓ 002 verified" || exit 1

      - name: Copy scripts + assets into upstream
        run: |
          DST="upstream/scripts/onprem"
          mkdir -p "$DST"
          cp scripts/download.ts "$DST/"
          cp scripts/pack.ts    "$DST/"
          cp scripts/env.sh     "$DST/"
          cp manifest.json      "$DST/"
          cp plugins.json       "$DST/"
          echo "✓ copied to $DST:"
          ls "$DST"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64 zstd

      - name: Install upstream deps
        working-directory: upstream
        run: bun install

      - name: Build linux-x64
        working-directory: upstream
        run: bun run scripts/onprem/pack.ts --platform linux --arch x64

      - name: Collect artifacts
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in upstream/dist/*.tar.zst upstream/dist/*.7z; do
            echo "→ $(basename "$f")"
            cp "$f" dist/
          done
          echo "---"
          ls -lh dist/

      - name: Generate release notes
        run: |
          cat <<EOF > release_body.md
          ## opencode onprem v${{ env.UPSTREAM_VER }}

          同步更新到 v${{ env.UPSTREAM_VER }} 版本。

          详细更新参阅 [OpenCode v${{ env.UPSTREAM_VER }} Release](https://github.com/anomalyco/opencode/releases/tag/v${{ env.UPSTREAM_VER }})。

          ---

          Synchronized update to version v${{ env.UPSTREAM_VER }}.
          See [OpenCode v${{ env.UPSTREAM_VER }} Release](https://github.com/anomalyco/opencode/releases/tag/v${{ env.UPSTREAM_VER }}) for detailed updates.
          EOF

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OpenCode Onprem ${{ env.TAG_NAME }}"
          tag_name: ${{ env.TAG_NAME }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: |
            dist/*.tar.zst
            dist/*.7z
